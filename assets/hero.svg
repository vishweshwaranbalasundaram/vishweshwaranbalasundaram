<circle cx="940" cy="375" r="118" fill="none" stroke="#58a6ff" stroke-opacity=".25" stroke-dasharray="3 7"/>
<circle cx="940" cy="375" r="80" fill="none" stroke="#8b5cf6" stroke-opacity=".35" stroke-dasharray="2 6"/>
<circle cx="940" cy="375" r="46" fill="none" stroke="#22d3ee" stroke-opacity=".35"/>
<g><animateTransform attributeName="transform" type="rotate" from="0 940 375" to="360 940 375" dur="22s" repeatCount="indefinite"/>
