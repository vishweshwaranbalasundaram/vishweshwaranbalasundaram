<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d">
<title id="t">Vishweshwaran V. — software engineering and applied AI</title>
<desc id="d">Animated dark profile header for Vishweshwaran V., a Computer Science and Engineering student in Chennai focused on software engineering, applied AI and full-stack development.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090c1a"/><stop offset=".55" stop-color="#070914"/><stop offset="1" stop-color="#150f2b"/></linearGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset=".55" stop-color="#8b9dff"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient>
<radialGradient id="a1"><stop offset="0" stop-color="#3b82f6" stop-opacity=".55"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<radialGradient id="a2"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".5"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<radialGradient id="a3"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a5b4fc" stroke-opacity=".06"/></pattern>
<clipPath id="card"><rect width="1200" height="540" rx="18"/></clipPath>
<clipPath id="tick"><rect x="58" y="486" width="1084" height="30"/></clipPath>
</defs>
<style>
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,40px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-30px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-50px)}}
@keyframes sweep{0%,10%{transform:translateX(-500px)}90%,100%{transform:translateX(1100px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-1030px)}}
@keyframes r1{0%,4%{opacity:0}9%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes r2{0%,18%{opacity:0}23%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes r3{0%,34%{opacity:0}39%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes r4{0%,50%{opacity:0}55%,92%{opacity:1}98%,100%{opacity:0}}
.d1{animation:d1 14s ease-in-out infinite}.d2{animation:d2 17s ease-in-out infinite}.d3{animation:d3 12s ease-in-out infinite}
.sw{animation:sweep 6s cubic-bezier(.65,0,.35,1) infinite}
.bl{animation:blink 1s steps(1,end) infinite}.pu{animation:pulse 2.2s ease-in-out infinite}
.tk{animation:tk 26s linear infinite}
.l1{animation:r1 11s infinite}.l2{animation:r2 11s infinite}.l3{animation:r3 11s infinite}.l4{animation:r4 11s infinite}
@media(prefers-reduced-motion:reduce){.d1,.d2,.d3,.sw,.bl,.pu,.tk{animation:none!important}.l1,.l2,.l3,.l4{animation:none!important;opacity:1!important}}
</style>
<g clip-path="url(#card)">
<rect width="1200" height="540" fill="url(#bg)"/>
<rect width="1200" height="540" fill="url(#grid)"/>
<g class="d1"><circle cx="240" cy="150" r="300" fill="url(#a1)"/></g>
<g class="d2"><circle cx="980" cy="380" r="320" fill="url(#a2)"/></g>
<g class="d3"><circle cx="640" cy="40" r="240" fill="url(#a3)"/></g>
<rect x="0" y="0" width="1200" height="540" fill="none"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="538.5" rx="18" fill="none" stroke="#28324d" stroke-width="1.5"/>

