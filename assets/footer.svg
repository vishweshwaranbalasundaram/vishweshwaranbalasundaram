<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Discipline over motivation. Progress over perfection.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090c1a"/><stop offset="1" stop-color="#150f2b"/></linearGradient>
<linearGradient id="w" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff" stop-opacity=".55"/><stop offset=".5" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".45"/></linearGradient>
<linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
<clipPath id="c"><rect width="1200" height="220" rx="18"/></clipPath>
</defs>
<style>
@keyframes w1{from{transform:translateX(0)}to{transform:translateX(-600px)}}
@keyframes w2{from{transform:translateX(-600px)}to{transform:translateX(0)}}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
.w1{animation:w1 12s linear infinite}.w2{animation:w2 18s linear infinite}.bl{animation:bl 1s steps(1,end) infinite}
@media(prefers-reduced-motion:reduce){.w1,.w2,.bl{animation:none!important}}
</style>
<g clip-path="url(#c)">
<rect width="1200" height="220" fill="url(#bg)"/>
<g class="w2" opacity=".55"><path d="M0 150 C100 120 200 180 300 150 S500 120 600 150 S800 180 900 150 S1100 120 1200 150 S1400 180 1500 150 S1700 120 1800 150 V220 H0Z" fill="url(#w)"/></g>
<g class="w1"><path d="M0 172 C100 145 200 199 300 172 S500 145 600 172 S800 199 900 172 S1100 145 1200 172 S1400 199 1500 172 S1700 145 1800 172 V220 H0Z" fill="url(#w)"/></g>
</g>
<rect x=".75" y=".75" width="1198.5" height="218.5" rx="18" fill="none" stroke="#28324d" stroke-width="1.5"/>
<text x="600" y="82" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="30" letter-spacing="2" fill="url(#tx)">DISCIPLINE OVER MOTIVATION.</text>
<text x="600" y="120" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="30" letter-spacing="2" fill="#e6ebff">PROGRESS OVER PERFECTION.</text>
<text x="590" y="150" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" letter-spacing="3" fill="#8f9bbd">LEARN · BUILD · EVOLVE</text>
<rect class="bl" x="684" y="138" width="8" height="14" fill="#a78bfa"/>
</svg>
